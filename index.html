<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Git Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Todo App</h1>
        <p>Git Practice Project Todo List Test Commit</p>
    </div>


    <div class="input-section">
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Add a new task..." maxlength="100">
            <button id="addBtn">Add Task</button>
        </div>
    </div>

    
    <div class="todo-list" id="todoList">
        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM19 20H5V9h14v11z"/>
            </svg>
            <h3>No tasks yet!</h3>
            <p>Add your first task above to get started.</p>
        </div>
    </div>

    <div class="stats" id="stats" style="display: none;">
        <span id="totalTasks">0</span> total tasks •
        <span id="completedTasks">0</span> completed •
        <span id="pendingTasks">0</span> pending
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
